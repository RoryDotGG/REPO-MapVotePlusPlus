<!doctype html>
<!-- Thunderstore icon (256x256): the vote list in miniature, with your pick in amber under the game's cursor. Render with docs/mockups/render.ps1. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="mockup.css">
<style>
  html, body { width: 256px; height: 256px; background: #0d0d10; }
  .hazard { position: absolute; left: 0; right: 0; height: 30px; background: repeating-linear-gradient(-45deg, #ffb31a 0 16px, #0d0d10 16px 32px); }
  .name { position: absolute; left: 0; right: 0; top: 44px; text-align: center; font: 400 52px/1 "Bebas Neue", sans-serif; color: #ffb31a; }
  .list { position: absolute; left: 22px; top: 104px; width: 212px; height: 110px; background: #17171b; }
  .line { position: absolute; left: 22px; top: 104px; width: 212px; height: 3px; background: #ffb31a; }
  .item { position: absolute; left: 12px; width: 188px; height: 30px; }
  .item i { position: absolute; left: 0; top: 5px; width: 5px; height: 20px; }
  .item b { position: absolute; left: 14px; top: 11px; height: 8px; border-radius: 4px; background: #6f6f74; }
  .item s { position: absolute; right: 0; top: 0; text-decoration: none; font: 500 30px/30px Teko, sans-serif; color: #f3eee4; }
  .item.picked b { background: #ffb31a; }
  .item.picked s { color: #ffb31a; }
  .icon-cursor { position: absolute; left: 150px; top: 158px; width: 26px; height: 25px; overflow: visible; }
  .icon-cursor polygon { fill: #ef8e08; stroke: #0d0d10; stroke-width: 3px; paint-order: stroke; }
</style>
</head>
<body>
<div class="hazard" style="top:0"></div>
<div class="hazard" style="bottom:0"></div>
<div class="name">MAP VOTE++</div>
<div class="list"></div>
<div class="line"></div>
<div class="item" style="left:34px;top:115px"><i style="background:#6a4bb5"></i><b style="width:92px"></b><s>1</s></div>
<div class="item picked" style="left:34px;top:149px"><i style="background:#3f7fb0"></i><b style="width:122px"></b><s>2</s></div>
<div class="item" style="left:34px;top:183px"><i style="background:#2f8f62"></i><b style="width:76px"></b><s></s></div>
<svg class="icon-cursor" viewBox="0 0 50 48"><polygon points="0,0 50,21 23,29 16,48"/></svg>
</body>
</html>
