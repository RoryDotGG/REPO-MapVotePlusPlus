name = "mapvote-stats"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Served only at mvpp.rory.gg. Deploying creates its DNS record, which takes priority over the *.rory.gg wildcard.
routes = [{ pattern = "mvpp.rory.gg", custom_domain = true }]
workers_dev = false

# No request logs: they would hold IP addresses.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "mapvote-stats"
database_id = "f772fe11-e1b9-4202-bf84-44bb1a315169"

# Flood guard. Cloudflare counts per IP in memory for the period; the Worker never stores the IP.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
